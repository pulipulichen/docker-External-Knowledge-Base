name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    name: Basic syntax and configuration checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python -m py_compile

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          set -euo pipefail
          # Compose services reference .env via env_file, so the file must exist.
          # Create a temporary, empty local file without committing real secrets.
          # Keep interpolation enabled to parse volume paths with default values.
          if [ -e .env ]; then
            echo "Unexpected .env exists in CI checkout; refusing to overwrite it." >&2
            exit 1
          fi
          touch .env
          trap 'rm -f .env' EXIT
          API_KEY=ci-placeholder docker compose --env-file .env config --quiet

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" >/dev/null
          done
